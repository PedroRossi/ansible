---
- name: Install snapd
  become: yes
  apt:
    pkg:
    - snapd
# Debian doesn't pre-wire snap the way Ubuntu/Pop do: enable the socket, create
# the /snap symlink that classic snaps (go, code) require, and let seeding settle.
- name: Enable and start snapd.socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: yes
    state: started
- name: Check whether /snap already exists (recent snapd creates it directly)
  ansible.builtin.stat:
    path: /snap
  register: snap_path
- name: Symlink /snap for classic snap confinement (only if snapd didn't make it)
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: not snap_path.stat.exists
- name: Wait for snapd seeding to complete (bounded — Debian seeding can stall)
  become: yes
  ansible.builtin.command: timeout 300 snap wait system seed.loaded
  changed_when: false
  failed_when: false
- name: add several snap items with --classic tag
  become: yes
  snap:
    name: "{{ item }}"
    classic: yes
  loop:
    - go
    - code
- name: Install snap packages
  become: yes
  snap:
    name:
      - slack
      - discord
      - spotify