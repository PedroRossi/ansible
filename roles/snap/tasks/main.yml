---
- name: Install snapd
  become: yes
  apt:
    pkg:
    - snapd
# Debian doesn't pre-wire snap the way Ubuntu/Pop do: enable the socket, create
# the /snap symlink that classic snaps (go, code) require, and let seeding settle.
- name: Enable and start snapd.socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: yes
    state: started
- name: Symlink /snap for classic snap confinement
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
    force: no
- name: Wait for snapd seeding to complete
  become: yes
  ansible.builtin.command: snap wait system seed.loaded
  changed_when: false
- name: add several snap items with --classic tag
  become: yes
  snap:
    name: "{{ item }}"
    classic: yes
  loop:
    - go
    - code
- name: Install snap packages
  become: yes
  snap:
    name:
      - slack
      - discord
      - spotify