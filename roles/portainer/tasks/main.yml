---
# Portainer CE management UI on http://<host>:9000 (plain HTTP; the box is reached only over
# the WireGuard VPN, so TLS on 9443 buys nothing). The stacks are deployed by hand through it.
- name: Check if the portainer container already exists
  become: yes
  command: docker ps -a --filter name=^portainer$ -q
  register: portainer_ps
  changed_when: false
- name: Run Portainer CE
  become: yes
  command: >
    docker run -d --name portainer --restart=always
    -p 9000:9000
    -v /var/run/docker.sock:/var/run/docker.sock
    -v portainer_data:/data
    portainer/portainer-ce:latest
  when: portainer_ps.stdout == ""
